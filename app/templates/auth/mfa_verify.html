{% extends "base.html" %}
{% block title %}Two-factor code - Simon on the Streets{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-2">Enter your code</h1>
    <p class="text-sm text-gray-600 text-center mb-6">
        Open your authenticator app and enter the 6-digit code.
    </p>
    <form method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
            <label for="code" class="block text-sm font-medium text-gray-700 mb-1">Authentication code</label>
            <input
                type="text"
                id="code"
                name="code"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="20"
                required
                autofocus
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
            />
        </div>
        <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
            Continue
        </button>
    </form>
    <p class="mt-4 text-center text-xs text-gray-500">
        Lost your phone? Enter one of your recovery codes instead.
    </p>
</div>
{% endblock %}
